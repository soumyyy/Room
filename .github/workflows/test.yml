name: Test

on:
  push:
    paths:
      - 'home-control/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'home-control/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: home-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: home-control/package-lock.json
      - run: npm ci
      - run: npm test
